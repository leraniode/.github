    d="
      M 20,16
      Q 16,16 16,20
      L 16,180
      Q 16,184 20,184
      L 180,184
      Q 184,184 184,180
      L 184,154
      Q 184,150 180,150
      L 94,150
      Q 68,150 68,124
      L 68,20
      Q 68,16 64,16
      Z
    "
    transform="translate(40,32) scale(0.60)"
    fill="oklch(1 0 0 / 0.92)"
  />
</svg>
