<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Leraniode mark and wordmark</title>
  <desc id="desc">The Leraniode symbol paired with the leraniode wordmark on the corner-flow billboard background.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ba09a"/>
      <stop offset=".25" stop-color="#0c9ac3"/>
      <stop offset=".5" stop-color="#4d85fd"/>
      <stop offset=".75" stop-color="#a861f2"/>
      <stop offset="1" stop-color="#e33bb3"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.5" fill="#020202"/>
    </pattern>
    <linearGradient id="wedgeL" x1="0" y1="0" x2=".55" y2=".65">
      <stop offset="0" stop-color="#a861f2"/>
      <stop offset=".35" stop-color="#301c47"/>
      <stop offset="1" stop-color="#301c47" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wedgeR" x1="1" y1="0" x2=".45" y2=".65">
      <stop offset="0" stop-color="#e33bb3"/>
      <stop offset=".35" stop-color="#401534"/>
      <stop offset="1" stop-color="#401534" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2=".55" y2=".65">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2=".45" y2=".65">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mL"><rect width="1400" height="700" fill="url(#fadeL)"/></mask>
    <mask id="mR"><rect width="1400" height="700" fill="url(#fadeR)"/></mask>
  </defs>

  <rect width="1400" height="700" rx="48" fill="#020202"/>
  <g clip-path="inset(0 round 48)">
    <rect width="1400" height="700" fill="url(#wedgeL)"/>
    <rect width="1400" height="700" fill="url(#wedgeR)"/>
    <rect width="1400" height="700" fill="url(#dots)" mask="url(#mL)" opacity=".75"/>
    <rect width="1400" height="700" fill="url(#dots)" mask="url(#mR)" opacity=".75"/>
  </g>

