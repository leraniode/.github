<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Leraniode mark</title>
  <desc id="desc">A four-directional, tapered Leraniode symbol</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset="0.28" stop-color="#0c9ac3"/>
      <stop offset="0.55" stop-color="#4d85fd"/>
      <stop offset="0.78" stop-color="#a861f2"/>
      <stop offset="1" stop-color="#e33bb3"/>
    </linearGradient>
    <radialGradient id="glowA" cx="28%" cy="22%" r="65%">
      <stop offset="0" stop-color="#1ba09a" stop-opacity=".75"/>
      <stop offset=".48" stop-color="#4d85fd" stop-opacity=".22"/>
      <stop offset="1" stop-color="#07121d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="78%" cy="78%" r="58%">
      <stop offset="0" stop-color="#e33bb3" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#a861f2" stop-opacity=".16"/>
      <stop offset="1" stop-color="#07121d" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="2" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .075"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="506" height="512" rx="42" fill="url(#bg)"/>
  <circle cx="95" cy="112" r="170" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="424" cy="405" r="160" fill="url(#glowB)" filter="url(#blur)"/>
  <path d="M-40 392 C100 302 178 452 300 354 S520 250 558 142"
        fill="none" stroke="#ffffff" stroke-opacity=".09" stroke-width="2"/>
  <path d="M-30 424 C108 340 190 475 314 382 S522 292 550 192"
        fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
  <rect width="512" height="512" rx="42" filter="url(#grain)"/>

