<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">leraniode/ wordmark</title>
  <desc id="desc">Leraniode wordmark in the Leraniode cyan, blue, violet and pink palette on an atmospheric dark background.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset=".34" stop-color="#0b1722"/>
      <stop offset=".68" stop-color="#101027"/>
      <stop offset="1" stop-color="#16091b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ba09a"/>
      <stop offset=".25" stop-color="#0c9ac3"/>
      <stop offset=".5" stop-color="#4d85fd"/>
      <stop offset=".75" stop-color="#a861f2"/>
      <stop offset="1" stop-color="#e33bb3"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="cyanGlow" cx="18%" cy="40%" r="55%">
      <stop offset="0" stop-color="#1ba09a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#050912" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="pinkGlow" cx="86%" cy="70%" r="58%">
      <stop offset="0" stop-color="#e33bb3" stop-opacity=".20"/>
      <stop offset="1" stop-color="#050912" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <filter id="grain">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".65"
        numOctaves="2"
        seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .06"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Atmospheric background -->
  <rect
    width="1200"
    height="300"
    rx="36"
    fill="url(#bg)"/>

  <circle
    cx="180"
    cy="120"
    r="230"
    fill="url(#cyanGlow)"
    filter="url(#blur)"/>

  <circle
    cx="1050"
    cy="235"
    r="250"
    fill="url(#pinkGlow)"
    filter="url(#blur)"/>

  <!-- Subtle flowing light -->
  <path
    d="M-70 258
       C180 125 350 330 570 222
       S930 78 1270 160"
    fill="none"
    stroke="url(#accent)"
    stroke-opacity=".14"
    stroke-width="18"
    filter="url(#softGlow)"/>

  <path
    d="M-60 258
       C190 132 350 325 575 220
       S935 82 1260 160"
    fill="none"
    stroke="url(#accent)"
    stroke-opacity=".12"
    stroke-width="2"/>

  <path
    d="M-50 280
       C190 155 370 345 600 238
       S960 110 1260 185"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".045"
    stroke-width="1"/>

  <!-- Grain -->
  <rect
    width="1200"
    height="300"
    rx="36"
    filter="url(#grain)"/>

  <!-- Wordmark, moved toward the lower-right -->
  <text
    x="1140"
    y="232"
    text-anchor="end"
    font-family="Nunito"
    font-size="108"
    font-weight="600"
    letter-spacing="2"
    fill="url(#accent)">leraniode</text>

  <!-- Subtle wordmark sheen -->
  <text
    x="1140"
    y="232"
    text-anchor="end"
    font-family="Nunito"
    font-size="108"
    font-weight="600"
    letter-spacing="2"
    fill="url(#sheen)"
    opacity=".45">leraniode</text>

  <!-- Small signature dots -->
  <circle cx="1020" cy="258" r="2.5" fill="#1ba09a"/>
  <circle cx="1038" cy="258" r="2.5" fill="#4d85fd"/>
  <circle cx="1056" cy="258" r="2.5" fill="#e33bb3"/>
</svg>
