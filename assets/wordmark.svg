<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">leraniode wordmark</title>
  <desc id="desc">Leraniode wordmark in the Leraniode cyan, blue, violet and pink palette on the edge-band background.</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1ba09a"/>
      <stop offset=".25" stop-color="#0c9ac3"/>
      <stop offset=".5" stop-color="#4d85fd"/>
      <stop offset=".75" stop-color="#a861f2"/>
      <stop offset="1" stop-color="#e33bb3"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".48" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="band" x1="0" y1=".5" x2=".55" y2=".5">
      <stop offset="0" stop-color="#e33bb3" stop-opacity=".5"/>
      <stop offset=".55" stop-color="#a861f2" stop-opacity=".26"/>
      <stop offset="1" stop-color="#a861f2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="36" fill="#020202"/>
  <rect width="1200" height="300" rx="36" fill="url(#band)"/>

  <text
    x="1090"
    y="205"
    text-anchor="end"
    font-family="Nunito"
    font-size="108"
    font-weight="600"
    letter-spacing="2"
    fill="url(#accent)">leraniode</text>

  <!-- Subtle wordmark sheen -->
  <text
    x="1090"
    y="205"
    text-anchor="end"
    font-family="Nunito"
    font-size="108"
    font-weight="600"
    letter-spacing="2"
    fill="url(#sheen)"
    opacity=".45">leraniode</text>

  <!-- Small signature dots -->
  <circle cx="970" cy="231" r="2.5" fill="#1ba09a"/>
  <circle cx="988" cy="231" r="2.5" fill="#4d85fd"/>
  <circle cx="1006" cy="231" r="2.5" fill="#e33bb3"/>
</svg>
