<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Leraniode X profile banner</title>
  <desc id="desc">The Leraniode corner-flow billboard background.</desc>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2.5" fill="#020202"/>
    </pattern>
    <linearGradient id="wedgeL" x1="0" y1="0" x2=".5" y2=".8">
      <stop offset="0" stop-color="#a861f2"/>
      <stop offset=".35" stop-color="#301c47"/>
      <stop offset="1" stop-color="#301c47" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wedgeR" x1="1" y1="0" x2=".5" y2=".8">
      <stop offset="0" stop-color="#e33bb3"/>
      <stop offset=".35" stop-color="#401534"/>
      <stop offset="1" stop-color="#401534" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeL" x1="0" y1="0" x2=".5" y2=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeR" x1="1" y1="0" x2=".5" y2=".8">
      <stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="mL"><rect width="1500" height="500" fill="url(#fadeL)"/></mask>
    <mask id="mR"><rect width="1500" height="500" fill="url(#fadeR)"/></mask>
  </defs>

  <rect width="1500" height="500" fill="#020202"/>
  <rect width="1500" height="500" fill="url(#wedgeL)"/>
  <rect width="1500" height="500" fill="url(#wedgeR)"/>
  <rect width="1500" height="500" fill="url(#dots)" mask="url(#mL)" opacity=".7"/>
  <rect width="1500" height="500" fill="url(#dots)" mask="url(#mR)" opacity=".7"/>
</svg>
